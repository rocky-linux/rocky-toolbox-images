---
name: Build CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run_toolbox_builds:
    strategy:
      matrix:
        version:
          - major: 8
            arch: 'amd64, arm64'
          - major: 9
            arch: 'amd64, arm64, ppc64le, s390x'
        registry:
          - domain: docker.io
            account: rockylinux
            secret: DOCKER
          - domain: quay.io
            account: rockylinux
            secret: QUAY
    runs-on: ubuntu-latest
    name: Build and push toolbox images
    steps:
      - uses: actions/checkout@v7

      - name: Install QEMU support
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-binfmt

      - name: Build image
        uses: redhat-actions/buildah-build@v3
        id: build-image
        with:
          archs: ${{ matrix.version.arch }}
          build-args: |
            ImageVersion=${{ matrix.version.major }}
          containerfiles: |
            ./Dockerfile
          labels: |
            name=rocky-toolbox
            org.opencontainers.image.title=rocky-toolbox
            org.opencontainers.image.version=${{ matrix.version.major }}
          oci: true
          tags: ${{ matrix.registry.domain }}/${{ matrix.registry.account }}/rocky-toolbox:${{ matrix.version.major }}
